      <!-- ニュース管理（2026-11-23 ユーザー指示＝管理者メニューの「ニュースの作成」を、一覧・編集・新規作成のページに）。作成・編集は P61-11 -->
      <div class="p9030-wrap ktn-mgmt-wrap ktn-mgmt-stack">

        <div class="ktn-mgmt-head">
          <h2 class="ktn-mgmt-head__title">ニュース管理</h2>
          <p class="ktn-mgmt-head__en">News</p>
          <p class="ktn-mgmt-head__desc">これまでに作成したお知らせ（ニュース・おすすめ）の一覧です。新しく作るときは「ニュースを作成する」、直すときは行の「編集 →」から開きます。メールは、公開したあとに編集の画面の「メールを送信する」で送ります。</p>
        </div>

        <!-- タブ：公開中・公開予定／終了（表示期限を過ぎたもの）（2026-11-23 ユーザー指示） -->
        <div class="p902-tab-nav" role="tablist" id="p9030Tabs">
          <button type="button" class="p902-tab-btn is-active" role="tab" data-tab="open" aria-selected="true">公開中・公開予定 <span class="ktn-count ktn-count--pill is-idle"></span></button>
          <button type="button" class="p902-tab-btn" role="tab" data-tab="ended" aria-selected="false">終了 <span class="ktn-count ktn-count--pill is-idle"></span></button>
        </div>

        <div class="p319-toolbar">
          <div class="p319-toolbar__filters">
            <label class="p319-filter" id="p9030StField">
              <span class="p319-filter__label">状態</span>
              <select class="p319-filter__sel" id="p9030St">
                <option value="">すべて</option>
                <option value="live">公開中</option>
                <option value="sched">公開予定</option>
              </select>
            </label>
            <label class="p319-filter">
              <span class="p319-filter__label">トップページ</span>
              <select class="p319-filter__sel" id="p9030Top">
                <option value="">すべて</option>
                <option value="1">トップに出す</option>
                <option value="0">トップに出さない</option>
              </select>
            </label>
            <label class="p319-filter">
              <span class="p319-filter__label">カテゴリ</span>
              <select class="p319-filter__sel" id="p9030Cat">
                <option value="">すべて</option>
                <option value="ニュース">ニュース</option>
                <option value="おすすめ">おすすめ</option>
              </select>
            </label>
            <label class="p319-filter">
              <span class="p319-filter__label">対象</span>
              <select class="p319-filter__sel" id="p9030Tg">
                <option value="">すべて</option>
                <option value="all">全員</option>
                <option value="user">ユーザー</option>
                <option value="cg">クリエイター・ギャラリー</option>
                <option value="creator">クリエイター</option>
                <option value="gallery">ギャラリー</option>
              </select>
            </label>
            <label class="p319-filter">

          <p class="ktn-count ktn-count--result" id="p9030Count"></p>
        </div>

  function setR(role, btn) {
    document.querySelectorAll('.dbtn').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    window.curRole = role;
    if (window.ktnRender) ktnRender();
