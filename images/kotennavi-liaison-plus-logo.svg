<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="liaison-plus-logo-title">
  <title id="liaison-plus-logo-title">LIAISON+ — Now on View + Shop</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;600;900&amp;family=Montserrat:wght@400;600;800&amp;display=swap');
    </style>
    <linearGradient id="liaison-plus-grad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6a4010"/>
      <stop offset="30%"  stop-color="#a87020"/>
      <stop offset="58%"  stop-color="#d4a428"/>
      <stop offset="100%" stop-color="#6a4010"/>
    </linearGradient>
    <path id="liaison-plus-arc-text" d="M 80 184 Q 240 56 400 184"/>
