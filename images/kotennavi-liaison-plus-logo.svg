  <path d="M 20 200 Q 240 33 460 200" stroke="url(#liaison-plus-grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text font-family="'Bodoni Moda',serif" font-size="58" font-weight="600" letter-spacing="8" fill="url(#liaison-plus-grad)">
