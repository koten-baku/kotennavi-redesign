  </text>
  <circle cx="432" cy="183" r="22" fill="#b87c10"/>
  <text x="432" y="183" font-family="'Bodoni Moda',serif" font-size="42" font-weight="900" fill="#fff8e8" text-anchor="middle" dominant-baseline="central">+</text>
  <text x="240" y="220" font-family="'Montserrat',sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#8a6018" text-anchor="middle">Now on View + Shop</text>
