        <div class="ktn-mgmt-head">
          <h2 class="ktn-mgmt-head__title">作品へのお問合わせ</h2>
          <p class="ktn-mgmt-head__en">INQUIRIES</p>
          <p class="ktn-mgmt-head__desc">あなたの作品に届いたお問合わせを、すべての作品についてまとめて確認できます。<strong>未返信のお問合わせが上に並びます。</strong></p>
          <p class="ktn-mgmt-head__desc">行を開くと内容を確認して、その場で返信できます（<strong>1件のお問合わせに1回</strong>）。返信の内容は送信者にメールでお知らせします。返信しないお問合わせは「返信せずに終える」を選ぶと、対応済みになります（送信者には通知されません）。</p>
        </div>

        <!-- ツールバー：作品・状態 -->
        <div class="p319-toolbar">
          <div class="p319-toolbar__filters">
            <label class="p319-filter">
              <span class="p319-filter__label">作品</span>
              <select class="p319-filter__sel" id="inqFilterWork">
                <option value="">すべて</option>
              </select>
            </label>
            <label class="p319-filter">
              <span class="p319-filter__label">状態</span>
              <select class="p319-filter__sel" id="inqFilterStatus">
                <option value="">すべて</option>
                <option value="unreplied">未返信</option>
                <option value="replied">返信済</option>
                <option value="closed">対応済（返信なし）</option>
              </select>
            </label>
          </div>
        </div>

        <p class="ktn-count ktn-count--strong" id="inqCount"></p>
