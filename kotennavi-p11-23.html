        <div class="p211-field" style="margin-top:12px">
          <label class="p211-label">パスワード（確認用）<span class="ktn-req">必須</span></label>

        </div>

<script src="./kotennavi-pages.js"></script>
<script>
function p1123Submit() {
  var pw1f = document.getElementById('p1123Pw1');
  var pw2f = document.getElementById('p1123Pw2');
  var f1 = pw1f.closest('.p211-field');
  var f2 = pw2f.closest('.p211-field');
  f1.classList.remove('is-error'); f2.classList.remove('is-error');
  var errBox = document.getElementById('p1123SaveError');
  var errList = document.getElementById('p1123SaveErrorList');
  var errs = [];
  if (pw1f.value.trim() === '') { f1.classList.add('is-error'); errs.push('「パスワード」が未入力です。'); }
  if (pw2f.value.trim() === '') { f2.classList.add('is-error'); errs.push('「パスワード（確認用）」が未入力です。'); }
  if (pw1f.value && pw2f.value && pw1f.value !== pw2f.value) {
    f1.classList.add('is-error'); f2.classList.add('is-error');
    errs.push('入力されたパスワードが一致しません。');
  }
  if (errs.length) {
    errList.innerHTML = errs.map(function (e) { return '<li class="ktn-form-error__item">' + e + '</li>'; }).join('');
    errBox.hidden = false;
    return;
  }
  errBox.hidden = true;
  location.href = './kotennavi-p11-24.html';
}
KTN.init({ page: 'p11-23', role: 'guest' });
</script>
