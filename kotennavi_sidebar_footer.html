<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個展なび — サイドバー・フッター v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=DM+Serif+Display:ital@0;1&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./kotennavi-common.css">
</head>
<body>

<div class="ktn-toast" id="ktnToast"></div>

<!-- デモバー -->
<div class="dbar" id="dbar">
  <span class="dbar-sep">ロール：</span>
  <button class="dbtn on" onclick="setR('guest',this)">ゲスト</button>
  <button class="dbtn" onclick="setR('login',this)">ログイン</button>
  <button class="dbtn" onclick="setR('user+creator',this)">creator本人</button>
  <button class="dbtn" onclick="setR('user+gallery',this)">gallery本人</button>
  <button class="dbtn" onclick="setR('admin',this)">管理者</button>
  <span class="dbar-sep">広告エリア：</span>
  <button class="dbtn on" id="adBtnAds" onclick="toggleAd('ads')">AdSense</button>
  <button class="dbtn" id="adBtnPr" onclick="toggleAd('pr')">サイト内PR</button>
</div>

<div class="shell">

<!-- サイドバー（kotennavi-p1.html と同一マークアップ・#ktnRoleNav は renderSidebar() がJS注入） -->
<aside class="ktn-sidebar" id="ktnSidebar">

  <!-- ロゴ (logo5-1) -->
  <a href="kotennavi-p1.html" class="ktn-sidebar__logo" data-page="p1">
    <img src="./images/kotennavi-logo5-1.svg" alt="個展なび">
  </a>

  <!-- 検索 → P10 検索ハブ -->
  <a href="kotennavi-p10.html" class="ktn-sidebar__item" data-page="p10">
    <div class="ktn-sidebar__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="11" cy="11" r="7.5"/>
        <path d="M21 21l-4.5-4.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="ktn-sidebar__label">検索</span>
  </a>

  <!-- お知らせ → P61（未制作） -->
  <a href="kotennavi-p61.html" class="ktn-sidebar__item" id="ktnSidebarNotice" data-page="p61">
    <div class="ktn-sidebar__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>
    <span class="ktn-sidebar__dot" id="ktnNoticeDot" style="display:none"></span>
    <span class="ktn-sidebar__label">お知らせ</span>
  </a>

  <!-- ガイド → P60（未制作） -->
  <a href="kotennavi-p60.html" class="ktn-sidebar__item" data-page="p60">
    <div class="ktn-sidebar__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-linecap="round"/>
        <path d="M12 16v-4M12 8h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      </svg>
    </div>
    <span class="ktn-sidebar__label">ガイド</span>
  </a>

  <div class="ktn-sidebar__divider"></div>

  <!-- ロール別アイコン（JS注入） -->
  <div id="ktnRoleNav" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>

  <div class="ktn-sidebar__footer">
    <a href="https://www.facebook.com/" target="_blank">Facebook</a><br>
    <a href="https://x.com/" target="_blank">X</a><br><br>
    ©2010 kotennavi<br>Co., Ltd.
  </div>
</aside>

<!-- ═══════ MAIN ═══════ -->
<main class="main">
  <div class="main-placeholder" id="mainPlaceholder">
    ← サイドバー / フッター / ボトムナビ コンポーネントデモ（現在: ホーム）
  </div>

  <!-- ═══════ AD BAND（フッター直前・コンテンツ同幅）═══════ -->
  <!--
    ■ 通常時：Google AdSense
      <div class="ktn-ad-band"> を使用（デフォルト）

    ■ サイト内PR時：class に ktn-ad-band--pr を追加
      .ktn-ad-band__pr-item を差し替えて使用
  -->

  <!-- ▼ Google AdSense（通常） -->
  <div class="ktn-ad-band" id="ktnAdBand">
    <div class="ktn-ad-band__inner">
      <div class="ktn-ad-band__slot">
        <!-- Google AdSense: ins class="adsbygoogle" をここに配置 -->
        広告エリア（728×90 / レスポンシブ）
      </div>
    </div>
  </div>

  <!-- ▼ サイト内PR（切替サンプル — JS で差し替え or サーバー側でテンプレート分岐） -->
  <div class="ktn-ad-band ktn-ad-band--pr" id="ktnAdBandPr" style="display:none">
    <div class="ktn-ad-band__inner">
      <div class="ktn-ad-band__slot">
        <div class="ktn-ad-band__pr">
          <span class="ktn-ad-band__pr-label">PR</span>
          <div class="ktn-ad-band__pr-items">

            <a href="/p2/123" class="ktn-ad-band__pr-item">
              <div class="ktn-ad-band__pr-thumb">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </div>
              <div class="ktn-ad-band__pr-body">
                <p class="ktn-ad-band__pr-tag">特集展覧会</p>
                <p class="ktn-ad-band__pr-title">春の版画展 2026 — 東京・銀座</p>
                <p class="ktn-ad-band__pr-sub">3/10（月）〜 3/30（日）</p>
              </div>
            </a>

            <a href="/p3/456" class="ktn-ad-band__pr-item">
              <div class="ktn-ad-band__pr-thumb">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <div class="ktn-ad-band__pr-body">
                <p class="ktn-ad-band__pr-tag">注目クリエイター</p>
                <p class="ktn-ad-band__pr-title">田中美咲 — 油彩・コラージュ</p>
                <p class="ktn-ad-band__pr-sub">LIAISON+ 出品中</p>
              </div>
            </a>

            <a href="/feature/kyushu" class="ktn-ad-band__pr-item">
              <div class="ktn-ad-band__pr-thumb">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              </div>
              <div class="ktn-ad-band__pr-body">
                <p class="ktn-ad-band__pr-tag">特集</p>
                <p class="ktn-ad-band__pr-title">九州の展覧会まとめ — 2026年春</p>
                <p class="ktn-ad-band__pr-sub">福岡・長崎・熊本エリア</p>
              </div>
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════ FOOTER（renderFooter() がJS注入・kotennavi-common.js と同一ソース） ═══════ -->
  <footer class="ktn-footer" id="ktnFooter"></footer>
</main>

<!-- ═══════ BOTTOM NAV ═══════ -->
<nav class="ktn-bottom-nav" id="ktnBottomNav">
  <div class="ktn-bottom-nav__inner" id="ktnBottomNavInner"></div>
</nav>

<script src="./kotennavi-common.js"></script>
<script src="./kotennavi-pages.js"></script>
<script>
  KTN.init({ page: 'sidebar-footer-demo', role: 'guest' });
  function toggleAd(mode) {
    document.getElementById('ktnAdBand').style.display   = mode === 'ads' ? '' : 'none';
    document.getElementById('ktnAdBandPr').style.display = mode === 'pr'  ? '' : 'none';
    document.getElementById('adBtnAds').classList.toggle('on', mode === 'ads');
    document.getElementById('adBtnPr').classList.toggle('on',  mode === 'pr');
  }
</script>
</body>
</html>
