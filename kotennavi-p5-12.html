<script src="kotennavi-pages.js"></script>
<script>
KTN.init({ page: 'p5-12', role: 'user+' });
(function () {
  // 管理ドロワー
  var drawer  = document.getElementById('p512Drawer');
  var mgmtBtn = document.getElementById('p512MgmtBtn');
  var dClose  = document.getElementById('p512DrawerClose');
  var dOver   = document.getElementById('p512DrawerOverlay');
  function openDrawer()  { if (drawer) drawer.classList.add('is-open'); }
  function closeDrawer() { if (drawer) drawer.classList.remove('is-open'); }
  if (mgmtBtn) mgmtBtn.addEventListener('click', openDrawer);
  if (dClose)  dClose.addEventListener('click', closeDrawer);
  if (dOver)   dOver.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  // パスワード表示トグル
  document.querySelectorAll('.p512-pw-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      if (!input) return;
      var isVisible = btn.classList.toggle('is-visible');
      input.type = isVisible ? 'text' : 'password';
    });
  });

  // 保存ボタン
  var saveBtn = document.getElementById('p512SaveBtn');
  if (saveBtn) {
    saveBtn.addEventListener('click', function () {
      var cur     = document.getElementById('p512CurrentPw');
      var newPw   = document.getElementById('p512NewPw');
      var confirm = document.getElementById('p512ConfirmPw');
      if (!cur || !cur.value || !newPw || !newPw.value || !confirm || !confirm.value) {
        KTN.toast('すべてのフィールドを入力してください');
        return;
      }
      if (newPw.value !== confirm.value) {
        KTN.toast('新しいパスワードが一致しません');
        return;
      }
      KTN.toast('パスワードを変更しました');
    });
  }
}());

// パスワード強度
function p512UpdateStrength(val) {
  var bars    = [document.getElementById('p512Bar1'),document.getElementById('p512Bar2'),document.getElementById('p512Bar3'),document.getElementById('p512Bar4')];
  var label   = document.getElementById('p512StrengthLabel');
  var classes = ['is-weak','is-fair','is-good'];
  var levels  = ['弱い','普通','強い','とても強い'];
  var score   = 0;
  if (val.length >= 8)  score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  bars.forEach(function (b, i) {
    if (!b) return;
    b.className = 'p512-strength__bar';
    if (val.length > 0 && i < score) {
      b.classList.add(score <= 1 ? 'is-weak' : score <= 2 ? 'is-fair' : 'is-good');
    }
  });
  if (label) label.textContent = val.length === 0 ? '' : levels[Math.min(score - 1, 3)] || '';
}
</script>
