<script>
var P613_DEMO = { name: '山田 花子', email: '1997sakura2022@gmail.com', uid: 'U-100482' };

function p613SetRole(role) {
  var login = (role === 'login');
  document.getElementById('dbarLogin').classList.toggle('on', login);
  document.getElementById('dbarGuest').classList.toggle('on', !login);
  document.getElementById('p613GuestNotice').hidden = login;
  document.getElementById('p613FormBlock').hidden = !login;
  if (login) {
    document.getElementById('p613AccountName').innerHTML = P613_DEMO.name + ' <small>' + P613_DEMO.email + '</small>';
    document.getElementById('p613Uid').value = P613_DEMO.uid;
  }
  window.ktnState.role = login ? 'login' : 'guest';
}

function p613ValidateRequired() {
  document.querySelectorAll('.p211-field.is-error').forEach(function (f) { f.classList.remove('is-error'); });
  var errBox = document.getElementById('p613SaveError');
  var errList = document.getElementById('p613SaveErrorList');
  var missing = [];
  document.querySelectorAll('#p613FormBlock .p211-label .ktn-req').forEach(function (mark) {
    var field = mark.closest('.p211-field');
    if (!field) return;
    var inputs = field.querySelectorAll('input:not([type=file]), select, textarea');
    var filled = inputs.length > 0 && Array.prototype.every.call(inputs, function (el) { return el.value.trim() !== ''; });
    if (!filled) {
      field.classList.add('is-error');
      var label = mark.closest('.p211-label');
      var name = '必須項目';
      if (label) {
        var clone = label.cloneNode(true);
        var req = clone.querySelector('.ktn-req');
        if (req) req.parentNode.removeChild(req);
        name = clone.textContent.trim() || name;
      }
      missing.push({ name: name, field: field });
    }
  });
  if (missing.length) {
    errList.innerHTML = '';
    var sum = document.createElement('li');
    sum.className = 'ktn-form-error__item';
    sum.textContent = '必須項目に未入力が' + missing.length + '件あります。入力してから送信してください。';
    errList.appendChild(sum);
    missing.forEach(function (m) {
      var li = document.createElement('li');
      li.className = 'ktn-form-error__item';
      li.appendChild(document.createTextNode('「' + m.name + '」が未入力です。 '));
      var jump = document.createElement('button');
      jump.type = 'button';
      jump.className = 'ktn-form-error__jump';
      jump.textContent = '該当箇所へ →';
      jump.addEventListener('click', function () { m.field.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
      li.appendChild(jump);
      errList.appendChild(li);
    });
    errBox.hidden = false;
    errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return false;
  }
  errBox.hidden = true;
  return true;
}

function p613Submit() {
  if (!p613ValidateRequired()) return;
  KTN.submitDone({
    title: 'お問合わせを送信しました',
    message: '作家へ通知されました。<br>ご返信までお待ちください。',
    action: { label: '作品ページへ戻る', href: './kotennavi-p6.html' }
  });
}

KTN.init({ page: 'p6-13', role: 'login' });
p613SetRole('login');
</script>
