  <main class="ktn-main" id="ktnMain">
    <div class="ktn-content">

      <!-- ガイドの編集（2026-11-01 新設・handoff 追174-378）。P60 系・P70 系のガイドを ?page=p70-2 のように選んで直す。
           前工程ではこの画面（個展なびの見た目のブロック編集）で作り、Drupal の標準の管理画面にするかは後工程が決める。中身は pages.js KTN.pages['p60-21'] -->
      <div class="ktn-mgmt-context" id="p6021Context">
        <div class="ktn-mgmt-context__media ktn-mgmt-context__media--content" aria-hidden="true"></div>
        <div class="ktn-mgmt-context__body">
          <a class="ktn-mgmt-context__name" id="p6021CtxName" href="#"></a>
          <p class="ktn-mgmt-context__meta" id="p6021CtxMeta"></p>
        </div>
        <div class="ktn-mgmt-context__actions"><a class="ktn-action-btn" id="p6021CtxView" href="#" target="_blank" rel="noopener">ガイドを見る →</a></div>
      </div>

      <div class="p6021-wrap ktn-mgmt-wrap" id="p6021Wrap">

        <div class="ktn-mgmt-head">
          <h2 class="ktn-mgmt-head__title">ガイドの編集</h2>
          <p class="ktn-mgmt-head__en">GUIDE EDIT</p>
        </div>

        <div class="p211-block">
          <div class="p211-block__head"><h3 class="p211-block__title">基本情報 <span class="p211-block__title-en">BASIC INFO</span></h3></div>
          <div class="p211-block__body">
            <div class="p211-field">
              <label class="p211-label" for="p6021Page">編集するガイド</label>
              <select class="p211-select" id="p6021Page"></select>
            </div>
            <div class="p211-field">
              <label class="p211-label" for="p6021Title">タイトル<span class="ktn-req">必須</span></label>
              <input class="p211-input" id="p6021Title" type="text" maxlength="60" data-count>
            </div>
            <div class="p211-field">
              <label class="p211-label" for="p6021Lead">リード文</label>
              <textarea class="p211-textarea" id="p6021Lead" rows="3" maxlength="300" data-count></textarea>
            </div>
            <div class="p211-field">
              <label class="p211-label" for="p6021Desc">ページの説明（検索結果に出る文）</label>
              <textarea class="p211-textarea" id="p6021Desc" rows="2" maxlength="120" data-count></textarea>
            </div>
          </div>
        </div>

        <div class="p211-block">
          <div class="p211-block__head"><h3 class="p211-block__title">本文 <span class="p211-block__title-en">BLOCKS</span></h3></div>
          <div class="p211-block__body">
            <p class="p211-help">上から順に並びます。ブロックの種類はガイドの部品（見出し・本文・注意の囲み・表・手順の図・よくある質問・画像）と同じです。</p>
            <div class="p6021-blocks" id="p6021Blocks"></div>
            <div class="p6021-add" id="p6021Add"></div>
            <!-- 差し込める値（料率などは P90-20 の設定から入る。文章に数字を直接書かない） -->
            <div class="p6021-vars">
              <p class="p6021-vars__head">差し込める値</p>
              <p class="p211-help">押すと、いま入力している欄に入ります。数字や行き先は、表示するときに今の設定で入れ替わります。</p>
              <div class="p6021-vars__list" id="p6021Vars"></div>
            </div>
          </div>
        </div>

        <!-- 管理者コメント・編集の記録 -->
        <div class="ktn-admin-note" id="p6021AdminNote" hidden>
          <div class="ktn-admin-note__head"><span class="ktn-admin-note__badge">Admin</span><span class="ktn-admin-note__title">管理者コメント</span></div>
          <p class="ktn-admin-note__desc">変更の理由・申し送りを記録します。管理者のみが閲覧できます。</p>
          <textarea maxlength="500" data-count class="ktn-admin-note__textarea" id="p6021AdminComment" placeholder="例：2026-11-01 料率の説明を最新の決まりに合わせて直した。"></textarea>
        </div>
        <div class="ktn-admin-note" id="p6021Log" data-kind="ガイド" hidden></div>

        <div class="ktn-form-error" id="p6021Error" role="alert" hidden>
          <div class="ktn-form-error__head"><span class="ktn-form-error__title">保存できませんでした</span></div>
          <ul class="ktn-form-error__list" id="p6021ErrorList"></ul>
        </div>

        <div class="p211-submit-bar">
          <button class="p211-submit-bar__cancel ktn-op-btn" type="button" onclick="history.back()">キャンセル</button>
          <a class="ktn-action-btn" id="p6021Preview" href="#" target="_blank" rel="noopener">プレビュー →</a>
          <button class="p211-submit-bar__submit ktn-op-btn ktn-op-btn--primary" type="button" id="p6021Save">保存する</button>
        </div>

      </div><!-- /.ktn-mgmt-wrap -->
